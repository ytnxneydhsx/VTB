<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>刻晴语音筛选台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">RVC v2 · 32k 训练集准备</p>
        <h1>刻晴语音筛选台</h1>
      </div>
      <div class="topbar-actions">
        <span id="saveState" class="save-state">已自动保存</span>
        <a class="export-link" href="/api/export?status=keep&amp;format=csv">导出保留清单</a>
      </div>
    </header>

    <section class="summary-grid" aria-label="筛选进度">
      <article class="metric metric-main">
        <span>完成进度</span>
        <strong id="progressValue">0%</strong>
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
      </article>
      <article class="metric"><span>待筛选</span><strong id="unreviewedCount">—</strong></article>
      <article class="metric keep"><span>保留</span><strong id="keepCount">—</strong></article>
      <article class="metric reject"><span>剔除</span><strong id="rejectCount">—</strong></article>
      <article class="metric unsure"><span>待定</span><strong id="unsureCount">—</strong></article>
      <article class="metric"><span>已保留时长</span><strong id="keepDuration">—</strong></article>
    </section>

    <section class="toolbar" aria-label="筛选条件">
      <label>
        <span>状态</span>
        <select id="statusFilter">
          <option value="unreviewed">只看待筛选</option>
          <option value="all">全部</option>
          <option value="keep">已保留</option>
          <option value="reject">已剔除</option>
          <option value="unsure">待定</option>
        </select>
      </label>
      <label>
        <span>数据集</span>
        <select id="splitFilter">
          <option value="all">训练集 + 验证集</option>
          <option value="train">训练集</option>
          <option value="val">验证集</option>
        </select>
      </label>
      <label>
        <span>音频格式</span>
        <select id="formatFilter">
          <option value="all">全部格式</option>
          <option value="pcm44100">44.1kHz PCM</option>
          <option value="float22050">22.05kHz Float</option>
        </select>
      </label>
      <label class="search-field">
        <span>搜索文件或备注</span>
        <input id="searchInput" type="search" placeholder="例如 100 或 爆音">
      </label>
      <button id="refreshButton" class="secondary-button" type="button">刷新</button>
    </section>

    <main class="workspace">
      <section class="review-panel" aria-live="polite">
        <div id="emptyState" class="empty-state" hidden>
          <strong>当前筛选条件下没有语音</strong>
          <p>可以切换状态或返回上一页继续检查。</p>
        </div>

        <div id="reviewContent">
          <div class="clip-heading">
            <div>
              <span id="clipPosition" class="clip-position">第 — 条</span>
              <h2 id="clipName">正在载入…</h2>
            </div>
            <span id="statusBadge" class="status-badge unreviewed">待筛选</span>
          </div>

          <p id="clipPath" class="clip-path"></p>

          <div class="metadata-row">
            <span id="formatLabel">—</span>
            <span id="durationLabel">—</span>
            <span id="sizeLabel">—</span>
            <span id="relatedLabel">—</span>
          </div>

          <div class="player-card">
            <audio id="audioPlayer" controls preload="metadata"></audio>
            <div class="player-options">
              <label><input id="autoPlay" type="checkbox" checked> 切换后自动播放</label>
              <label>
                播放速度
                <select id="playbackRate">
                  <option value="0.75">0.75×</option>
                  <option value="1" selected>1.00×</option>
                  <option value="1.25">1.25×</option>
                  <option value="1.5">1.50×</option>
                </select>
              </label>
            </div>
          </div>

          <div class="decision-grid" aria-label="筛选判断">
            <button class="decision keep-button" data-status="keep" type="button">
              <kbd>1</kbd><span><strong>保留</strong><small>声音干净、角色一致</small></span>
            </button>
            <button class="decision reject-button" data-status="reject" type="button">
              <kbd>2</kbd><span><strong>剔除</strong><small>杂音、混响、重叠或异常</small></span>
            </button>
            <button class="decision unsure-button" data-status="unsure" type="button">
              <kbd>3</kbd><span><strong>待定</strong><small>稍后集中复核</small></span>
            </button>
          </div>

          <label class="note-field">
            <span>备注</span>
            <textarea id="noteInput" rows="3" placeholder="例如：有环境音、尾部爆音、疑似重复……"></textarea>
          </label>

          <div class="navigation-row">
            <button id="previousButton" class="secondary-button" type="button">← 上一条</button>
            <button id="resetButton" class="ghost-button" type="button">恢复待筛选</button>
            <button id="nextButton" class="secondary-button" type="button">下一条 →</button>
          </div>

          <div class="shortcut-hint">
            <span><kbd>Space</kbd> 播放/暂停</span>
            <span><kbd>R</kbd> 从头播放</span>
            <span><kbd>←</kbd><kbd>→</kbd> 上一条/下一条</span>
          </div>
        </div>
      </section>

      <aside class="queue-panel">
        <div class="queue-heading">
          <div><span>当前队列</span><strong id="queueCount">—</strong></div>
          <span id="pageLabel">—</span>
        </div>
        <ol id="queueList" class="queue-list"></ol>
        <div class="pagination">
          <button id="previousPage" class="ghost-button" type="button">上一页</button>
          <button id="nextPage" class="ghost-button" type="button">下一页</button>
        </div>
      </aside>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
